mautic.social.oauth.callback_hint="Copy the callback URL into the provider app settings, then Authorize. Tokens are stored encrypted on the integration."
mautic.social.capabilities.heading="Capabilities and limits"

mautic.social.twitter.notes.authorization="X (Twitter) API v2 with OAuth 2.0. Create an app at developer.x.com, set the callback URL shown here, then Authorize. Tokens are stored encrypted. Posting and recent search usually require a paid X API tier."
mautic.social.twitter.notes.features="Supported: post tweets, recent search, contact profile sync, campaign Send Tweet, hashtag/mention monitoring. Limits: X API rate limits and tiers apply; legacy v1.1 is not used."
mautic.social.twitter.tweet.event.open="Send Tweet (X)"
mautic.social.twitter.tweet.event.open_desc="Post a saved Tweet entity via X API v2. The contact must have a Twitter handle. Sends as the authorized app account."

mautic.social.facebook.notes.authorization="Facebook Login and Graph API v26. Create a Meta app, add Facebook Login, set Valid OAuth Redirect URIs to the Mautic callback, then Authorize."
mautic.social.facebook.notes.features="Supported: login and contact profile fields from Graph. Limits: page publishing and ads are not included; Instagram is a separate integration."

mautic.social.instagram.notes.authorization="Instagram Business/Creator via Facebook Graph v26. Requires a Facebook Page linked to an Instagram Business account. Authorize with Instagram scopes on the same Meta app."
mautic.social.instagram.notes.features="Supported: business discovery and hashtag search. Limits: personal Instagram accounts are not supported; full content publishing needs extra Meta permissions and is not fully automated here."

mautic.social.yelp.notes.authorization="Yelp Fusion API. Paste your API key from Yelp Developers. No browser OAuth."
mautic.social.yelp.notes.features="Supported: business search, place details by id, monitoring cron (query format term|location). Limits: no social posting — places directory API (Foursquare replacement)."

mautic.social.mastodon.notes.authorization="Mastodon OAuth2 on your instance. Create an application on the instance, set redirect URI to the Mautic callback, enter instance URL and client id/secret, then Authorize (scopes: read write)."
mautic.social.mastodon.notes.features="Supported: post status, account lookup, campaign Post to Mastodon, tag timeline monitoring. Limits: you post as the authorized account, not as each contact; federation behavior depends on the instance."

mautic.social.bluesky.notes.authorization="Bluesky AT Protocol. Use handle plus app password (bsky.app Settings → App passwords). Optional custom PDS (default bsky.social). No browser OAuth."
mautic.social.bluesky.notes.features="Supported: create post, public profile, campaign Post to Bluesky, search monitoring. Limits: posts as the configured account; PDS rate limits apply."

mautic.social.googleplaces.notes.authorization="Google Places API (New). Enable Places API in Google Cloud and paste an API key."
mautic.social.googleplaces.notes.features="Supported: text search and place details by place id. Limits: no social posting or campaign actions; Google Cloud billing applies."

mautic.social.reddit.notes.authorization="Reddit OAuth2. Create an app at reddit.com/prefs/apps, set redirect to the Mautic callback, then Authorize (scopes: identity read submit)."
mautic.social.reddit.notes.features="Supported: submit posts, user profile, search, campaign Submit to Reddit (channel target = subreddit), subreddit monitoring. Limits: Reddit API rules and spam filters may hold or reject posts."

mautic.social.telegram.notes.authorization="Telegram Bot API. Create a bot with @BotFather, paste bot token and optional default chat id. No OAuth."
mautic.social.telegram.notes.features="Supported: sendMessage and campaign Send Telegram message. Limits: no public search; the bot can only message users who started it or groups it belongs to."

mautic.social.youtube.notes.authorization="YouTube Data API v3 via Google OAuth. Enable the API in Google Cloud, set redirect URI, Authorize (scope youtube.readonly by default)."
mautic.social.youtube.notes.features="Supported: channel profile, video search, monitoring. Limits: no video upload from this plugin without additional write scopes."

mautic.social.pinterest.notes.authorization="Pinterest API v5 OAuth. Create an app, set redirect URI, Authorize (scopes boards:read, pins:read, pins:write, user_accounts:read)."
mautic.social.pinterest.notes.features="Supported: user account profile and create pin (image URL + board id). Limits: pin creation needs board_id and a public image URL; no dedicated campaign action yet."

mautic.social.discord.notes.authorization="Discord webhook URL and/or bot token. No browser OAuth."
mautic.social.discord.notes.features="Supported: webhook post, bot channel message, campaign Send Discord message. Limits: no profile search or history read via webhook."

mautic.social.whatsapp.notes.authorization="WhatsApp Cloud API (Meta). Permanent access token, Phone number ID, optional WABA ID from Meta Business Suite."
mautic.social.whatsapp.notes.features="Supported: session text, templates, campaign Send WhatsApp. Limits: free-form text only within the 24h customer-care window after the user messages you; outside that window only approved templates. Opt-in required."

mautic.social.linkedin.notes.authorization="LinkedIn OAuth2. Enable Sign In with LinkedIn and Share on LinkedIn, set redirect URI, Authorize (scopes openid profile email w_member_social)."
mautic.social.linkedin.notes.features="Supported: member profile, Posts API text post, campaign Post to LinkedIn. Limits: posts as the authorized member; no public search API in this plugin."

mautic.social.wechat.notes.authorization="WeChat Official Account. AppID and AppSecret from mp.weixin.qq.com. Access token is fetched and cached automatically."
mautic.social.wechat.notes.features="Supported: profile by openid, customer-service text, templates, campaign Send WeChat. Limits: CS text only within 48h of user interaction unless using templates. No public search."

mautic.social.wecom.notes.authorization="WeCom (Enterprise WeChat). Corp ID, application Secret, and Agent ID from work.weixin.qq.com."
mautic.social.wecom.notes.features="Supported: member profile by userid, app text messages, campaign Send WeCom. Limits: recipients must be corp members (touser = userid)."

mautic.social.tiktok.notes.authorization="TikTok Login Kit and Display API. Create an app, set redirect URI, Authorize (scopes user.info.basic, user.info.profile, user.info.stats, video.list)."
mautic.social.tiktok.notes.features="Supported: authorized user profile, list own videos, monitoring of account videos. Limits: Content Posting (upload) needs extra app review and is not enabled by default; no arbitrary public hashtag search."

mautic.social.twitch.notes.authorization="Twitch Helix OAuth. Register at dev.twitch.tv, set redirect URI, Client ID/Secret, Authorize. Client-Id is required on every Helix call."
mautic.social.twitch.notes.features="Supported: user profile, channel search, streams, chat send, campaign Send Twitch chat, monitoring. Limits: chat needs user:write:chat and broadcaster/sender ids — not a long-form post network."

mautic.social.rumble.notes.authorization="Rumble partner API (invite-based). API key and default channel slug. Channel slug alone can still map a public profile URL."
mautic.social.rumble.notes.features="Supported: channel profile, publish video metadata, campaign Publish to Rumble. Limits: binary video upload depends on partner API; no public search monitoring."

mautic.social.telegram.send="Send Telegram message"
mautic.social.telegram.send_desc="Bot API sendMessage. Optional channel target = chat id; else contact telegram field or default chat. User must have started the bot or the bot must be in the group."
mautic.social.discord.send="Send Discord message"
mautic.social.discord.send_desc="Webhook or bot channel message. Channel target = Discord channel id (bot); if empty, uses the configured webhook. Lead tokens supported."
mautic.social.mastodon.post="Post to Mastodon"
mautic.social.mastodon.post_desc="Publishes a status as the authorized Mastodon account (not per-contact). Lead tokens supported."
mautic.social.bluesky.post="Post to Bluesky"
mautic.social.bluesky.post_desc="Creates a Bluesky post as the configured handle. Lead tokens supported."
mautic.social.reddit.submit="Submit to Reddit"
mautic.social.reddit.submit_desc="Self-post to a subreddit. Channel target = subreddit name without r/. Title is taken from the start of the message. Subject to Reddit spam rules."
mautic.social.whatsapp.send="Send WhatsApp message"
mautic.social.whatsapp.send_desc="Cloud API text to contact phone/whatsapp or channel target. Free-form text only inside the 24h session window unless using approved templates."
mautic.social.linkedin.post="Post to LinkedIn"
mautic.social.linkedin.post_desc="Posts to the authorized LinkedIn member feed. Lead tokens supported. Not a per-contact direct message."
mautic.social.wechat.send="Send WeChat message"
mautic.social.wechat.send_desc="Official Account CS message to openid (contact field or channel target). Requires 48h interaction window unless using templates."
mautic.social.wecom.send="Send WeCom message"
mautic.social.wecom.send_desc="Enterprise WeChat app message to member userid (contact field or channel target)."
mautic.social.twitch.chat="Send Twitch chat message"
mautic.social.twitch.chat_desc="Helix chat message as the authorized user. Optional channel target = broadcaster user id. Requires chat scope."
mautic.social.rumble.publish="Publish to Rumble"
mautic.social.rumble.publish_desc="Registers video metadata via partner API. Binary upload is separate. Requires API key."

mautic.social.campaign.message="Message"
mautic.social.campaign.message.tooltip="Message body. Lead tokens such as {contactfield=firstname} are replaced at send time. For Reddit, the first ~100 characters are used as the title."
mautic.social.campaign.channel_target="Channel / target override"
mautic.social.campaign.channel_target.tooltip="Optional: Telegram chat id, Discord channel id, Reddit subreddit, WhatsApp/WeChat/WeCom recipient, Twitch broadcaster id. Empty = contact fields or integration defaults."
mautic.social.campaign.error.no_handle="Contact is missing the required social handle or recipient id for this channel"
